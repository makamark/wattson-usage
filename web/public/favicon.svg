<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Token Meter</title>
  <desc id="desc">A macOS style electricity meter icon with a token counter, token chip and code brackets.</desc>
  <defs>
    <linearGradient id="case" x1="180" y1="100" x2="840" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#353A3B"/><stop offset="1" stop-color="#1D2223"/>
    </linearGradient>
    <linearGradient id="face" x1="512" y1="150" x2="512" y2="870" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF8F1"/><stop offset="1" stop-color="#EAE6DC"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#101819" flood-opacity=".2"/>
    </filter>
  </defs>
  <!-- Transparent margin follows macOS icon proportions. -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#case)"/>
    <rect x="146" y="146" width="732" height="732" rx="142" fill="url(#face)"/>
  </g>
  <!-- Restrained industrial fasteners. -->
  <g fill="#303638">
    <circle cx="210" cy="210" r="14"/><circle cx="814" cy="210" r="14"/>
    <circle cx="210" cy="814" r="14"/><circle cx="814" cy="814" r="14"/>
  </g>
  <!-- Meter scale. -->
  <path d="M256 535 A256 256 0 0 1 768 535" stroke="#303638" stroke-width="28" stroke-linecap="round"/>
  <path d="M681 343 A256 256 0 0 1 768 535" stroke="#447E72" stroke-width="28" stroke-linecap="round"/>
  <g stroke="#303638" stroke-width="18" stroke-linecap="round">
    <path d="M318 464 343 474"/><path d="m372 353 18 25"/>
    <path d="M512 322v32"/><path d="m652 353-18 25"/>
    <path d="m706 464-25 10"/>
  </g>
  <!-- Pointer reads as a physical instrument at small sizes. -->
  <path d="m488 517 166-117c12-8 25 5 16 17L533 554Z" fill="#303638"/>
  <circle cx="512" cy="535" r="36" fill="#303638"/>
  <circle cx="512" cy="535" r="10" fill="#F3F0E7"/>
  <!-- Code brackets associate the measured units with computation. -->
  <g stroke="#447E72" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="m440 220-23 20 23 20"/><path d="m584 220 23 20-23 20"/>
  </g>
  <g fill="#447E72"><rect x="470" y="225" width="24" height="30" rx="6"/><rect x="502" y="225" width="24" height="30" rx="6"/><rect x="534" y="225" width="24" height="30" rx="6"/></g>
  <!-- Mechanical counter: four token blocks plus one outlined remaining unit. -->
  <rect x="244" y="626" width="536" height="142" rx="35" fill="#303638"/>
  <g fill="#F2EFE6">
    <rect x="268" y="650" width="62" height="94" rx="10"/>
    <rect x="342" y="650" width="62" height="94" rx="10"/>
    <rect x="416" y="650" width="62" height="94" rx="10"/>
    <rect x="490" y="650" width="62" height="94" rx="10"/>
  </g>
  <rect x="566" y="653" width="56" height="88" rx="8" stroke="#AAAFA8" stroke-width="6"/>
  <!-- T is outlined geometry, independent of installed fonts. -->
  <rect x="650" y="650" width="106" height="94" rx="17" fill="#447E72"/>
  <path d="M675 674h56v14h-20v34h-16v-34h-20Z" fill="#FAF8F1"/>
</svg>
