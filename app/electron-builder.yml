# app/electron-builder.yml — 打包配置。
# 内嵌资源（server/codeburn/web/sync，含 node_modules 里的 tsx）先由
# scripts/prepare-stage.sh 组装到 app/stage/wattson/，这里整目录拷入 Resources
# （不进 asar，tsx 才能按真实文件路径解析 server/node_modules 与 ../codeburn/src），
# 与 server/src/main.ts 由自身文件位置推导 ROOT 的逻辑对齐：
# 打包态 ROOT=Resources/wattson → 默认 webDist=wattson/web/dist。
# 注意：extraResources 的 filter 会硬性排除 node_modules，所以必须走 stage 目录。
# target/arch 由 CLI 参数给（--mac dir / --mac dmg），不写在 yml 里（26.x schema 限制）。
appId: com.wattson.app
productName: Wattson
directories:
  output: release
files:
  - dist/**
  - build/**
  - package.json
extraResources:
  - from: stage/wattson
    to: wattson
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  extendInfo:
    LSUIElement: true # 菜单栏应用：不占 Dock

