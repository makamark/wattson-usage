<!doctype html>
<!-- app/src/popup/index.html — 状态栏小窗。数据经 preload IPC 推送（渲染层无网络权限），
     分项列表遵循看板口径：过滤零值、按用量降序、保留合计。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Wattson</title>
<style>
  :root {
    --bg: #14181a; --panel: #22282a; --panel-2: #2a3134; --border: rgba(250,248,241,0.08);
    --text: #ece9df; --muted: #a3aca6; --muted-2: #7d8781;
    --accent: #57a48f; --accent-soft: rgba(87,164,143,0.16);
    --ok: #4cc38a; --warn: #e0a458; --err: #e5735c;
  }
  * { box-sizing: border-box; }
  /* main/.errbox 是滚动容器，Chromium 会隐式聚焦它们；小窗复用再次弹出时焦点
     程序化恢复到容器，:focus-visible 默认描边会在整个内容区画一圈系统色边框。
     滚动定位无需可见焦点，明确关闭（按钮等控件的焦点圈不受影响） */
  main:focus, main:focus-visible, .errbox:focus, .errbox:focus-visible { outline: none; }
  /* select 同理（时间筛选曾复现）：小窗复用再次弹出时焦点恢复到上次操作的 select，
     macOS 原生控件按系统强调色画聚焦圈；鼠标驱动的菜单小窗无需 select 聚焦圈 */
  select:focus, select:focus-visible { outline: none; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 12px 13px 10px; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    background:
      radial-gradient(420px 220px at 90% -20%, rgba(87,164,143,0.10), transparent 65%),
      var(--bg);
    color: var(--text); font-size: 13px; line-height: 1.45;
    display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  header { display: flex; align-items: center; gap: 8px; padding-bottom: 9px; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 7px; }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 7px; flex: none;
    display: inline-flex; align-items: center; justify-content: center; color: #447062;
    background: linear-gradient(135deg, #f7f4ea, #e6e1d5);
  }
  header b { font-size: 14px; letter-spacing: 0.02em; }
  .chips { margin-left: auto; display: flex; gap: 5px; align-items: center; min-width: 0; overflow: hidden; }
  .chip { font-size: 10.5px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .chip.live { color: var(--ok); border-color: rgba(76,195,138,0.35); }
  select {
    margin-left: auto; flex: none; font: inherit; font-size: 11.5px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 2px 4px 2px 8px; cursor: pointer;
  }
  select:hover { border-color: rgba(255,255,255,0.16); }
  main { flex: 1; overflow-y: auto; padding: 4px 2px; }
  /* 小窗空间宝贵：隐藏滚动条（触控板/滚轮滚动不受影响），errbox 同理 */
  main::-webkit-scrollbar, .errbox::-webkit-scrollbar { display: none; }
  main { scrollbar-width: none; }
  h2 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 10px 2px 6px; letter-spacing: 0.08em; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: 8px 11px; }
  .kpi-top { display: flex; align-items: center; gap: 6px; }
  .kpi-icon { color: var(--accent); display: inline-flex; }
  .kpi .l { font-size: 10.5px; color: var(--muted); }
  .kpi .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .kpi-foot { display: flex; align-items: baseline; gap: 5px; min-height: 14px; margin-top: 1px; }
  .delta { font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--ok); }
  .delta.down { color: var(--err); }
  .alltime { margin-top: 6px; font-size: 11px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 2px; }
  .row .name { width: 86px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .bar-wrap { flex: 1; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .row .bar { height: 100%; border-radius: 3px; background: var(--accent); }
  .row .tk { width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .row .cost { width: 58px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row.total { border-top: 1px solid var(--border); margin-top: 3px; padding-top: 5px; color: var(--muted); }
  .row.total .tk, .row.total .cost { color: var(--text); }
  .acct { background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: 8px 11px; margin-bottom: 7px; }
  .acct-head { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
  .acct-logo {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
  }
  .acct-logo { border-radius: 50%; background: linear-gradient(135deg, #f7f4ea, #e6e1d5); padding: 3px; box-sizing: border-box; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
  .acct-logo-fallback { display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #447062; }
  .row-logo { border-radius: 3px; background: #f2efe6; margin-right: 4px; vertical-align: -2px; }
  .acct-name { font-weight: 600; font-size: 12px; }
  .acct-badge { font-size: 10px; color: #d5e5de; background: var(--accent-soft); border: 1px solid rgba(87,164,143,0.4); border-radius: 999px; padding: 0 7px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct-badge.reset { color: #f0d9ac; background: rgba(210,153,34,0.12); border-color: rgba(210,153,34,0.4); }
  .plan-row { display: flex; align-items: center; gap: 7px; padding: 3px 0; }
  .plan-row .plan-name { width: 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
  .plan-row .bar-wrap { flex: 1; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .plan-row .bar { display: block; height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .plan-row .plan-nums { width: 92px; text-align: right; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .plan-row .plan-nums.hot { color: var(--err); font-weight: 600; }
  details.detail { margin-top: 4px; }
  details.detail summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.08em; padding: 4px 2px;
  }
  details.detail summary::-webkit-details-marker { display: none; }
  details.detail summary::after { content: ""; width: 7px; height: 7px; margin-left: 2px; border-right: 1.5px solid var(--muted-2); border-bottom: 1.5px solid var(--muted-2); transform: rotate(45deg); transition: transform 0.15s ease; }
  details.detail[open] summary::after { transform: rotate(225deg); }
  details.detail summary:hover { color: var(--text); }
  .placeholder { text-align: center; color: var(--muted); padding: 40px 12px; }
  .placeholder .big { font-size: 15px; color: var(--text); margin-bottom: 8px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .errbox { background: rgba(229,115,92,0.08); border: 1px solid rgba(229,115,92,0.3); color: var(--err); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow-y: auto; font-size: 12px; }
  footer { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
  button { flex: 1; font: inherit; font-size: 12.5px; color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: var(--panel-2); border-color: rgba(255,255,255,0.16); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #63b29c; }
  button:disabled { opacity: 0.5; cursor: default; }
  .note { font-size: 11px; color: var(--muted); margin-top: 6px; }
</style>
</head>

  <header>
    <div class="brand">
      <span class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.5" fill="#2b3032"/><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="4.2" fill="#f2efe6"/><path d="M6.4 14.4a5.6 5.6 0 0 1 11.2 0" stroke="#303638" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M13.9 14.4l3-3.2" stroke="#57a48f" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="14.4" r="1.7" fill="#303638"/><circle cx="12" cy="14.4" r="0.6" fill="#f2efe6"/></svg></span>
      <b>Wattson</b>
    </div>
    <select id="sel-range" title="统计范围">
      <option value="today">今日</option>
      <option value="24h">24h</option>

  <footer>
    <button id="btn-refresh">刷新数据</button>
    <button id="btn-open" class="primary">打开完整看板</button>
  </footer>

const fmtTokens = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n)
const fmtCost = (n) => n === null || n === undefined ? '—' : '$' + n.toFixed(n < 10 ? 3 : 2)
const fmtClock = (ms) => new Date(ms).toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' })
const fmtPct = (n) => n === null || n === undefined ? '—' : (n * 100).toFixed(1) + '%'

/* 环比箭头：命中率用百分点差，其余用百分比变化（无上一窗口不显示） */
function deltaHtml(key, cur, prev) {
  if (!prev || prev[key] == null || cur[key] == null) return ''
  if (key === 'cacheHitRate') {
    const diff = (cur[key] - prev[key]) * 100
    if (!Number.isFinite(diff) || Math.abs(diff) < 0.05) return ''
    const up = diff > 0
    return `<span class="delta ${up ? 'up' : 'down'}">${up ? '↑' : '↓'} ${Math.abs(diff).toFixed(1)}pp</span>`
  }
  const p = Number(prev[key])
  if (p <= 0) return ''
  const pct = (Number(cur[key]) - p) / p * 100
  if (!Number.isFinite(pct) || Math.abs(pct) < 0.5) return ''
  const up = pct > 0
  return `<span class="delta ${up ? 'up' : 'down'}">${up ? '↑' : '↓'} ${Math.abs(pct).toFixed(1)}%</span>`
}

/* 分项行（过滤零值、按 token 降序）+ 合计 */
function breakdown(title, map) {
  const entries = Object.entries(map || {}).filter(([, v]) => v.tokens > 0).sort((a, b) => b[1].tokens - a[1].tokens)
  if (entries.length === 0) return ''
  const total = entries.reduce((s, [, v]) => s + v.tokens, 0)
  const totalCost = entries.reduce((s, [, v]) => s + (v.cost ?? 0), 0)
  const anyCost = entries.some(([, v]) => v.cost !== null && v.cost !== undefined)
  const max = entries[0][1].tokens
  const rows = entries.map(([name, v], i) => `
    <div class="row">
      <span class="name" title="${esc(name)}">${LOGOS[name] ? `<img class="row-logo" src="${LOGOS[name]}" alt="" width="12" height="12" />` : ''}${esc(name)}</span>
      <span class="bar-wrap"><span class="bar" style="width:${(v.tokens / max * 100).toFixed(1)}%;${i === 0 ? '' : 'opacity:' + Math.max(0.45, 1 - i * 0.12).toFixed(2)}"></span></span>
      <span class="tk">${fmtTokens(v.tokens)}</span>
      <span class="cost">${fmtCost(v.cost)}</span>
    </div>`).join('')
  return `<h2>${esc(title)}</h2>${rows}
    <div class="row total"><span class="name">合计</span><span class="bar-wrap"></span>
      <span class="tk">${fmtTokens(total)}</span><span class="cost">${anyCost ? fmtCost(totalCost) : '—'}</span></div>`
}

function renderChips(s) {
  const chips = []
  const st = s.status
  if (st) chips.push(`<span class="chip">数据 ${fmtClock(st.fetchedAt)}${st.recordCount ? ' · ' + st.recordCount.toLocaleString('zh-CN') + ' 条' : ''}</span>`)
  if (st && st.refreshing) chips.push('<span class="chip live">解析中…</span>')
  if (s.mirror && s.mirror.running) chips.push('<span class="chip live">同步中…</span>')
  if (s.phase === 'external') chips.push('<span class="chip" title="复用了已在运行的服务（如 launchd 安装）">外部服务</span>')
  $('#chips').innerHTML = chips.join('')
}

/* 订阅额度（多账号）：品牌色标 + 套餐徽标 + 每窗口条 + 重置倒计时；
   主数字为剩余口径（对齐官方展示），无凭据/加载中的账号整块隐藏，剩余 ≤30% 的窗口数字标红（重点） */
const QUOTA_SHORT = { fiveHour: '5小时', week: '周', weekSonnet: '周·Sonnet', extra: '额外', cycle: '周期' }
const ACCOUNT_SHORT = { glm: 'GLM', codex: 'Codex', claude: 'Claude', cursor: 'Cursor', workbuddy: 'WorkBuddy', trae: 'Trae', kimi: 'Kimi', gemini: 'Gemini', grok: 'Grok', zed: 'Zed', kiro: 'Kiro', codebuff: 'Codebuff', factory: 'Factory', copilot: 'Copilot', openrouter: 'OpenRouter', minimax: 'MiniMax' }

function planSection(plan) {
  const accounts = (plan && plan.accounts) || []
  const available = accounts.filter((a) => a.available && a.windows && a.windows.length > 0)
  if (available.length === 0) return ''
  const fmtReset = (ms) => {
    if (!ms) return ''
    const delta = ms - Date.now()
    if (delta <= 0) return '已重置'
    const d = Math.floor(delta / 86400e3), h = Math.floor((delta % 86400e3) / 3600e3), m = Math.round((delta % 3600e3) / 60e3)
    if (d > 0) return `${d}d${h}h`
    return h > 0 ? `${h}h${m}m` : `${m}m`
  }
  const block = (a) => {
    const rows = a.windows.map((w) => {
      const hasAbs = typeof w.total === 'number' && w.total !== null
      // 剩余口径（对齐订阅产品官方展示，如 zcode「剩余 66%」）：
      // 绝对值口径由 remaining/total 向上取整（同官方 zcode），纯百分比口径用 100 - 已用%
      const remainingAbs = hasAbs ? (w.remaining ?? Math.max(0, w.total - (w.used || 0))) : null
      const remainPct = remainingAbs !== null && w.total > 0
        ? Math.ceil(Math.min(100, Math.max(0, remainingAbs / w.total * 100)))
        : 100 - Math.min(100, Math.max(0, w.percentage ?? w.usedPercent ?? 0))
      const hot = remainPct <= 10 ? 'var(--err)' : remainPct <= 30 ? 'var(--warn)' : 'var(--accent)'
      const reset = fmtReset(w.nextResetAt)
      const tip = hasAbs ? `剩 ${remainPct}% · 已用 ${w.used}/${w.total}` : `剩 ${remainPct}%`
      const nums = `剩 ${remainPct}%${reset ? ' · ' + reset : ''}`
      return `<div class="plan-row" title="${esc(w.label)} ${esc(tip)}${reset ? ' · ' + reset + '后重置' : ''}">
        <span class="plan-name">${esc(QUOTA_SHORT[w.key] || w.label)}</span>
        <span class="bar-wrap"><span class="bar" style="width:${Math.min(100, Math.max(0, remainPct)).toFixed(1)}%;background:${hot}"></span></span>
        <span class="plan-nums${remainPct <= 30 ? ' hot' : ''}">${esc(nums)}</span>
      </div>`
    }).join('')
    const name = ACCOUNT_SHORT[a.kind] || a.label
    const badge = a.planName && a.planName !== name ? `<span class="acct-badge">${esc(a.planName)}</span>` : ''
    const resetCount = typeof a.resetCredits === 'number' ? a.resetCredits : null
    const resetBadge = resetCount && resetCount > 0
      ? `<span class="acct-badge reset" title="额度重置卡：共 ${resetCount} 张，当前额度状态下可用 ${typeof a.applicableResetCredits === 'number' ? a.applicableResetCredits : 0} 张">重置卡 ×${resetCount}</span>`
      : ''
    return `<div class="acct">
      <div class="acct-head">${LOGOS[a.kind]
        ? `<img class="acct-logo" src="${LOGOS[a.kind]}" alt="" width="20" height="20" />`
        : `<span class="acct-logo acct-logo-fallback">${esc(name.slice(0, 1).toUpperCase())}</span>`}<span class="acct-name">${esc(name)}</span>${badge}${resetBadge}</div>
      ${rows}
    </div>`
  }
  return `<h2>订阅额度</h2>${available.map(block).join('')}`
}

const KPI_CARDS = [
  { key: 'totalTokens', label: 'Token 总量', ic: 'tokens', fmt: (v) => fmtTokens(Number(v)) },
  { key: 'totalCost', label: '估算成本', ic: 'cost', fmt: (v) => fmtCost(v) },
  { key: 'calls', label: '调用次数', ic: 'calls', fmt: (v) => Number(v).toLocaleString('zh-CN') },
  { key: 'cacheHitRate', label: '缓存命中', ic: 'zap', fmt: (v) => fmtPct(v) },
]

const RANGE_TITLES = { today: '今日', '24h': '近 24 小时', '7d': '近 7 天', '30d': '近 30 天' }

function render(s) {
  renderChips(s)
  const main = $('#main')
  const canRefresh = s.phase === 'ready' || s.phase === 'external'
  $('#btn-refresh').disabled = !canRefresh
  $('#btn-open').disabled = s.phase === 'error' && !s.configured
  const sel = $('#sel-range')
  if (sel.value !== (s.popupRange || '24h')) sel.value = s.popupRange || '24h'

  if (!s.configured) {
    main.innerHTML = `<div class="placeholder">
      <div class="big">尚未初始化</div>
      先完成多机设备配置（本机数据源 + 远端 SSH 镜像）<br>
      <button class="primary" style="margin-top:14px;flex:none" onclick="window.__openSettings()">打开初始化设置</button>
    </div>`
    return
  }
  if (s.phase === 'starting') {
    main.innerHTML = `<div class="placeholder"><span class="spin"></span>正在启动聚合服务<div class="note" id="wait"></div>
      <div class="note">冷启动需解析全量数据，约 1–2 分钟</div></div>`
    return
  }
  if (s.phase === 'error') {
    main.innerHTML = `<div class="placeholder"><div class="big" style="color:var(--err)">聚合服务未运行</div></div>
      <div class="errbox">${esc(s.phaseError || '未知错误')}</div>
      <button style="margin-top:10px" onclick="window.__retry()">重试启动</button>`
    return
  }
  const view = s.popupOverview || s.overview
  if (!view) {
    main.innerHTML = '<div class="placeholder"><span class="spin"></span>拉取用量数据…</div>'
    return
  }
  const errs = (s.status && s.status.errors && s.status.errors.length) ? s.status.errors : (view.errors || [])
  const range = s.popupRange || '24h'
  const kpiCards = KPI_CARDS.map((c) => {
    const delta = deltaHtml(c.key, view, view.prev)
    return `<div class="kpi">
      <div class="kpi-top"><span class="kpi-icon">${svg(c.ic, 13)}</span><span class="l">${c.label}</span></div>
      <div class="v">${c.fmt(view[c.key])}</div>
      <div class="kpi-foot">${delta}</div>
    </div>`
  }).join('')
  const detailOpen = localStorage.getItem('wattson.popup.detail') === '1'
  const detailBody = breakdown('按工具', view.byTool) + breakdown('按设备', view.byHost)
  main.innerHTML = `
    <h2>${RANGE_TITLES[range] || RANGE_TITLES['24h']}</h2>
    <div class="kpis">${kpiCards}</div>
    ${range === '24h' && view.allTime ? `<div class="alltime">全时段：${fmtTokens(view.allTime.totalTokens)} · ${fmtCost(view.allTime.totalCost)} · 活跃 ${view.allTime.activeDays} 天</div>` : ''}
    ${planSection(s.plan)}
    ${detailBody ? `<details class="detail" id="detail" ${detailOpen ? 'open' : ''}><summary>明细</summary>${detailBody}</details>` : ''}
    ${errs.length ? `<div class="errbox" style="margin-top:10px">${esc(errs.join('\n'))}</div>` : ''}`
  const detail = document.getElementById('detail')
  if (detail) detail.addEventListener('toggle', () => localStorage.setItem('wattson.popup.detail', detail.open ? '1' : '0'))
}

window.__openSettings = () => window.bridge.openSettings()
window.__retry = () => window.bridge.retryServer()
$('#btn-refresh').addEventListener('click', () => window.bridge.refreshData())
$('#btn-open').addEventListener('click', () => window.bridge.openDashboard())
// 选完即 blur：小窗 hide→show 复用时会恢复焦点到“上次聚焦元素”，
// select 若保持聚焦会在下次弹出时带系统强调色聚焦圈
$('#sel-range').addEventListener('change', (e) => { window.bridge.setRange(e.target.value); e.target.blur() })

/* starting 状态下的等待计时（每秒本地自刷，不依赖主进程推送） */
let lastState = null
window.bridge.onState((s) => { lastState = s; render(s) })
setInterval(() => {
  const el = document.getElementById('wait')
  if (el && lastState && lastState.startingSince) {
    el.textContent = '已等待 ' + Math.max(0, Math.round((Date.now() - lastState.startingSince) / 1000)) + ' 秒'
  }
}, 1000)
</script>
</body>
</html>
